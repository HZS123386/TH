name: fate

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fate
      POSTGRES_USER: fate
      POSTGRES_PASSWORD: ${FATE_DB_PASSWORD:?Set FATE_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fate -d fate"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: .
    image: fate-preview:1
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "alembic upgrade head && exec uvicorn fate.main:app --host 0.0.0.0 --port 8710 --no-access-log"]
    ports:
      - "127.0.0.1:8710:8710"
    restart: unless-stopped
  worker:
    image: fate-preview:1
    env_file: .env
    depends_on:
      api:
        condition: service_started
    command: ["python", "-m", "fate.worker"]
    restart: unless-stopped

volumes:
  pgdata:
