name: fate_h5
description: FATE Thai astrology landing and personal reports.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.1.4
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.2
  web: ^1.1.1
  video_player: ^2.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/copy.json
    - assets/images/
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-CJK.txt
    - assets/fonts/NotoSansSC-Regular.otf
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf
    - family: FateLanguageLabel
      fonts:
        - asset: assets/fonts/FateLanguageLabel.otf
