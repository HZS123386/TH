<!DOCTYPE html>
<html lang="th">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#130c24">
  <meta name="description" content="FATE · โหราศาสตร์ไทยและรายงานส่วนตัว · 泰式占星与个人运程报告">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="FATE · วิเคราะห์ดวงชะตา">
  <meta property="og:description" content="อ่านลักษณะส่วนตัวฟรี แล้วเปิดอ่านดวงเจ็ดหัวข้อ">
  <title>FATE</title>
  <template id="fate-engine-preloads">
    <!-- FATE_FONT_PRELOADS -->
    <link rel="preload" href="assets/FontManifest.json" as="fetch" fetchpriority="low" crossorigin>
    <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" fetchpriority="low" crossorigin>
  </template>
  <script>
    const requestedLanguage=new URLSearchParams(location.search).get('lang');
    const supportedLanguages=['th','en','zh','vi','my','km','lo','ms','id'];
    document.documentElement.lang=supportedLanguages.includes(requestedLanguage)?requestedLanguage:'th';
    function priorityPreload(href, as, priority = 'high') {
      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = as;
      link.href = href;
      link.crossOrigin = 'anonymous';
      link.fetchPriority = priority;
      return link;
    }
    const preloadEngineAssets = () => {
      const language = document.documentElement.lang;
      const switchFonts = {th:'NotoSansThai.ttf',zh:'FateChineseUI.otf',my:'NotoSansMyanmar-Regular.ttf',km:'NotoSansKhmer-Regular.ttf',lo:'NotoSansLao-Regular.ttf'};
      const selectedFont = switchFonts[language];
      if (selectedFont) {
        document.head.append(priorityPreload('assets/assets/fonts/' + selectedFont, 'fetch'));
      }
      document.head.append(priorityPreload('assets/assets/copy/' + language + '.json', 'fetch', 'low'));
      document.head.append(document.getElementById('fate-engine-preloads').content);
    };
  </script>
  <script src="browser.js"></script>
  <link rel="stylesheet" href="birth-form.css">
  <!-- FATE_WASM_RUNTIME_PRELOAD -->
  <style>
    html,body{margin:0;background:#130c24;color-scheme:dark}
    #fate-startup{position:fixed;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:22px;background:radial-gradient(ellipse at 50% 28%,#352046,#130c24 65%);color:#e4bc78;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:24px}
    #fate-startup img{width:112px;height:auto}
    #fate-startup-status{margin:0;color:#c6b7d3;font-size:13px}
    .fate-startup-track{width:132px;height:3px;background:#463655;overflow:hidden;border-radius:4px}
    .fate-startup-track:after{content:"";display:block;width:40%;height:100%;background:#e4bc78;border-radius:4px;animation:fate-startup-motion 1.3s ease-in-out infinite alternate}
    #fate-startup-retry{padding:8px 22px;border:1px solid #806548;border-radius:8px;background:transparent;color:#f4d399;font:inherit;cursor:pointer}
    .fate-startup-zh,.fate-startup-th,.fate-startup-en,.fate-startup-vi,.fate-startup-my,.fate-startup-km,.fate-startup-lo,.fate-startup-ms,.fate-startup-id{display:none}
    html:lang(zh) .fate-startup-zh,html:lang(th) .fate-startup-th,html:lang(en) .fate-startup-en,html:lang(vi) .fate-startup-vi,html:lang(my) .fate-startup-my,html:lang(km) .fate-startup-km,html:lang(lo) .fate-startup-lo,html:lang(ms) .fate-startup-ms,html:lang(id) .fate-startup-id{display:inline}
    @keyframes fate-startup-motion{to{transform:translateX(150%)}}
    @media(prefers-reduced-motion:reduce){.fate-startup-track:after{animation:none}}
  </style>
</head>
<body>
  <div id="fate-flutter"></div>
  <main id="fate-birth" hidden></main>
  <template id="fate-birth-template">
    <header class="birth-header">
      <img src="assets/assets/images/fate-brand-gold.png" alt="FATE" width="91" height="23">
      <select id="birth-language" aria-label="Language">
        <option value="th">ภาษาไทย</option><option value="en">English</option><option value="zh">简体中文</option>
        <option value="vi">Tiếng Việt</option><option value="my">မြန်မာဘာသာ</option><option value="km">ខ្មែរ</option>
        <option value="lo">ລາວ</option><option value="ms">Bahasa Melayu</option><option value="id">Bahasa Indonesia</option>
      </select>
    </header>
    <div id="birth-content">
      <section class="birth-portrait">
        <img src="assets/assets/images/astrologer-900.webp" alt="" width="1199" height="1312" decoding="async">
        <div class="birth-name"><strong data-copy="name"></strong><small data-copy="role"></small></div>
        <div class="birth-caption"><h1 data-copy="headline"></h1><p data-copy="note"></p></div>
      </section>
      <form id="birth-form" novalidate>
        <h2 data-copy="formTitle"></h2><p class="birth-hint" data-copy="formCaption"></p>
        <label for="birth-date-trigger"><span id="birth-date-label" data-copy="date"></span><small data-copy="calendar"></small></label>
        <input id="birth-date" type="date" min="1901-01-01" required hidden>
        <button class="birth-picker-trigger" id="birth-date-trigger" type="button" aria-haspopup="dialog" aria-controls="birth-picker" aria-labelledby="birth-date-label birth-date-value">
          <span id="birth-date-value"></span><span class="birth-picker-icon birth-picker-calendar" aria-hidden="true"></span>
        </button>
        <div class="birth-row"><label id="birth-time-label" for="birth-time-trigger" data-copy="time"></label>
          <label class="birth-check"><input type="checkbox" id="birth-unknown"><span data-copy="unknown"></span></label>
        </div>
        <input id="birth-time" type="time" required hidden>
        <button class="birth-picker-trigger" id="birth-time-trigger" type="button" aria-haspopup="dialog" aria-controls="birth-picker" aria-labelledby="birth-time-label birth-time-value">
          <span id="birth-time-value"></span><span class="birth-picker-icon birth-picker-clock" aria-hidden="true"></span>
        </button>
        <label for="birth-city" data-copy="city"></label>
        <div class="birth-location">
          <div id="birth-options-shield" aria-hidden="true" hidden></div>
          <input id="birth-city" type="search" role="combobox" aria-autocomplete="list" aria-controls="birth-options"
                 aria-expanded="false" maxlength="80" autocomplete="off" required>
          <div id="birth-options" role="listbox" hidden></div>
        </div>
        <div id="birth-career" hidden>
          <label for="birth-question" data-copy="questionTitle"></label><select id="birth-question"></select>
          <input id="birth-custom" type="text" maxlength="120" hidden>
        </div>
        <p id="birth-message" role="status" aria-live="polite"></p>
        <p class="birth-consent" data-copy="submitConsent"></p>
        <button type="submit" id="birth-submit"></button>
        <button type="button" id="birth-retry" hidden></button>
        <section class="birth-themes"><h3 data-copy="topicLabel"></h3><div id="birth-boards"></div></section>
      </form>
      <footer><p data-copy="disclaimer"></p></footer>
    </div>
    <dialog id="birth-picker" aria-labelledby="birth-picker-title">
      <h2 id="birth-picker-title"></h2>
      <div id="birth-picker-wheels" class="birth-picker-wheels"></div>
      <button id="birth-picker-confirm" type="button"></button>
      <button id="birth-picker-close" type="button"></button>
    </dialog>
    <section id="birth-generation" hidden aria-labelledby="birth-generation-title" tabindex="-1">
      <h1 id="birth-generation-title"></h1>
      <div class="fate-startup-track" aria-hidden="true"></div>
      <p id="birth-generation-status" role="status" aria-live="polite"></p>
      <button id="birth-generation-retry" type="button" hidden></button>
    </section>
  </template>
  <div id="fate-startup" role="status" aria-live="polite">
    <img src="assets/assets/images/fate-brand-gold.png" alt="FATE" width="112" height="26">
    <div class="fate-startup-track" aria-hidden="true"></div>
    <p id="fate-startup-status"><span class="fate-startup-zh">正在开启你的星空</span><span class="fate-startup-th">กำลังเปิดท้องฟ้าของคุณ</span><span class="fate-startup-en">Opening your sky</span><span class="fate-startup-vi">Đang mở bầu trời của bạn</span><span class="fate-startup-my">သင့်ကြယ်ကောင်းကင်ကို ဖွင့်နေသည်</span><span class="fate-startup-km">កំពុងបើកមេឃរបស់អ្នក</span><span class="fate-startup-lo">ກຳລັງເປີດທ້ອງຟ້າຂອງທ່ານ</span><span class="fate-startup-ms">Membuka langit anda</span><span class="fate-startup-id">Membuka langit Anda</span></p>
    <button id="fate-startup-retry" type="button" hidden><span class="fate-startup-zh">重新加载</span><span class="fate-startup-th">ลองโหลดใหม่</span><span class="fate-startup-en">Reload</span><span class="fate-startup-vi">Tải lại</span><span class="fate-startup-my">ပြန်တင်မယ်</span><span class="fate-startup-km">ផ្ទុកឡើងវិញ</span><span class="fate-startup-lo">ໂຫຼດໃໝ່</span><span class="fate-startup-ms">Muat semula</span><span class="fate-startup-id">Muat ulang</span></button>
  </div>
  <!-- FATE_BIRTH_COPY -->
  <script src="birth-form.js"></script>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
