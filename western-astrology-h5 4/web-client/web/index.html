<!DOCTYPE html>
<html lang="th">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#130c24">
  <meta name="description" content="FATE · โหราศาสตร์ไทยและรายงานส่วนตัว · 泰式占星与个人运程报告">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="FATE · วิเคราะห์ดวงชะตา">
  <meta property="og:description" content="อ่านลักษณะส่วนตัวฟรี แล้วเปิดอ่านดวงเจ็ดหัวข้อ">
  <title>FATE</title>
  <script>document.documentElement.lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'th';</script>
  <script src="browser.js"></script>
  <style>
    html,body{margin:0;background:#130c24;color-scheme:dark}
    #fate-startup{position:fixed;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:22px;background:radial-gradient(ellipse at 50% 28%,#352046,#130c24 65%);color:#e4bc78;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:24px}
    #fate-startup img{width:112px;height:auto}
    #fate-startup-status{margin:0;color:#c6b7d3;font-size:13px}
    .fate-startup-track{width:132px;height:3px;background:#463655;overflow:hidden;border-radius:4px}
    .fate-startup-track:after{content:"";display:block;width:40%;height:100%;background:#e4bc78;border-radius:4px;animation:fate-startup-motion 1.3s ease-in-out infinite alternate}
    #fate-startup-retry{padding:8px 22px;border:1px solid #806548;border-radius:8px;background:transparent;color:#f4d399;font:inherit;cursor:pointer}
    html:lang(zh) .fate-startup-th,html:lang(th) .fate-startup-zh{display:none}
    @keyframes fate-startup-motion{to{transform:translateX(150%)}}
    @media(prefers-reduced-motion:reduce){.fate-startup-track:after{animation:none}}
  </style>
  <link rel="preload" href="assets/assets/fonts/NotoSansThai.ttf" as="fetch" crossorigin>
  <!-- FATE_FONT_PRELOADS -->
  <script>
    const fatePreload=(href,priority='high')=>{const link=document.createElement('link');link.rel='preload';link.href=href;link.as='fetch';link.crossOrigin='anonymous';link.fetchPriority=priority;document.head.append(link);};
    if(document.documentElement.lang==='zh')fatePreload('assets/assets/fonts/FateChineseUI.otf');
    fatePreload('assets/FontManifest.json','low');
    fatePreload('assets/AssetManifest.bin.json','low');
    fatePreload('assets/assets/copy.json','low');
    if(!/(report|privacy|support)\.html$/.test(location.pathname))fatePreload('assets/assets/images/astrologer-900.webp');
  </script>
</head>
<body>
  <div id="fate-startup" role="status" aria-live="polite">
    <img src="assets/assets/images/fate-brand-gold.png" alt="FATE" width="112" height="26">
    <div class="fate-startup-track" aria-hidden="true"></div>
    <p id="fate-startup-status"><span class="fate-startup-zh">正在开启你的星空</span><span class="fate-startup-th">กำลังเปิดท้องฟ้าของคุณ</span></p>
    <button id="fate-startup-retry" type="button" hidden><span class="fate-startup-zh">重新加载</span><span class="fate-startup-th">ลองโหลดใหม่</span></button>
  </div>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
