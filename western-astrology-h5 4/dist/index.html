<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#130c24">
  <meta name="description" content="สำรวจตัวเองผ่านโหราศาสตร์ไทย เลือกเรื่องที่สนใจและอ่านรายงานส่วนตัวจากข้อมูลเกิดของคุณ">
  <script>document.documentElement.lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'th';</script>
  <title>ASTRO · AI — แผนที่ดวงดาวของคุณ</title>
  <link rel="preload" as="image" type="image/webp" href="assets/astrologer-purple-stars-900.webp" imagesrcset="assets/astrologer-purple-stars-450.webp 450w, assets/astrologer-purple-stars-900.webp 900w, assets/astrologer-purple-stars-1199.webp 1199w" imagesizes="(max-width: 450px) 100vw, 450px" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <header class="topbar">
    <a class="brand" href="#top" aria-label="FATE"><span class="brand-star">✧</span> FATE</a>
    <div class="languages" aria-label="Language"><button type="button" data-lang="th" class="active">TH</button><span>/</span><button type="button" data-lang="zh">中文</button></div>
  </header>
  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <picture>
        <source type="image/webp" srcset="assets/astrologer-purple-stars-450.webp 450w, assets/astrologer-purple-stars-900.webp 900w, assets/astrologer-purple-stars-1199.webp 1199w" sizes="(max-width: 450px) 100vw, 450px">
        <img class="portrait" src="assets/astrologer-purple-stars.png" width="1199" height="1312" alt="AI astrologer in a violet cloak surrounded by a golden zodiac wheel" fetchpriority="high" decoding="async">
      </picture>
      <div class="hero-shade"></div>
      <div class="persona"><span class="tiny-star">✦</span><span data-t="persona">หมอดู AI ส่วนตัวของคุณ</span></div>
      <div class="hero-copy">
        <div class="eyebrow" id="hero-eyebrow">ชีวิตคู่ · ดวงการเงิน · จังหวะชีวิต</div>
        <h1 id="hero-title">ชีวิตคู่มั่นคงไหม?<br><span>เมื่อไหร่จะพ้นช่วงขาลง?</span></h1>
        <p id="hero-sub" hidden></p>
      </div>
    </section>

    <section class="form-section" id="birth-section" aria-labelledby="form-title">
      <div class="form-heading"><span class="section-star">✦</span><h2 id="form-title" data-t="formTitle">ก้าวต่อไป ดวงดาวบอกอะไร?</h2><span class="section-star">✦</span></div>
      <p class="form-caption" data-t="formCaption">กรอกข้อมูลเกิดเพื่อดูดวงเฉพาะคุณ</p>
      <div id="thai-reading-root"></div>
      <noscript>请启用 JavaScript 生成个人报告 กรุณาเปิด JavaScript เพื่อสร้างรายงานส่วนตัว</noscript>
    </section>

    <footer>
      <p data-t="disclaimer">คำอ่านสร้างด้วย AI เพื่อความบันเทิงและสำรวจตัวเอง</p>
    </footer>
  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
