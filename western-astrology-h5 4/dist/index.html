<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#130c24">
  <meta name="description" content="สำรวจตัวเองผ่านโหราศาสตร์ไทย เลือกเรื่องที่สนใจและอ่านรายงานส่วนตัวจากข้อมูลเกิดของคุณ">
  <title>ASTRO · AI — แผนที่ดวงดาวของคุณ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Astro AI"><span class="brand-star">✧</span> ASTRO <span class="brand-dot">·</span> AI</a>
    <div class="languages" aria-label="Language"><button type="button" data-lang="th" class="active">TH</button><span>/</span><button type="button" data-lang="zh">中文</button></div>
  </header>
  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <img class="portrait" src="assets/astrologer.png" alt="AI astrologer in a violet cloak surrounded by a golden zodiac wheel" fetchpriority="high">
      <div class="hero-shade"></div>
      <div class="persona"><span class="tiny-star">✦</span><span data-t="persona">ผู้ช่วยโหราศาสตร์ AI</span></div>
      <div class="hero-copy">
        <div class="eyebrow" data-t="thaiLabel">โหราศาสตร์ไทย</div>
        <h1 id="hero-title">ชีวิตช่วงนี้<br><span>ควรโฟกัสเรื่องไหนดี?</span></h1>
        <p id="hero-sub">เข้าใจตัวเอง ทั้งความรักและการงาน<br>ผ่านแผนที่ดวงดาวของคุณ</p>
      </div>
    </section>

    <section class="form-section" id="birth-section" aria-labelledby="form-title">
      <div class="form-heading"><span class="section-star">✦</span><h2 id="form-title" data-t="formTitle">เริ่มจากข้อมูลวันเกิดของคุณ</h2><span class="section-star">✦</span></div>
      <p class="form-caption" data-t="formCaption">แผนที่ดวงดาวหนึ่งเดียว จากช่วงเวลาที่คุณเกิด</p>
      <div id="thai-reading-root"></div>
      <noscript>请启用 JavaScript 生成个人报告 กรุณาเปิด JavaScript เพื่อสร้างรายงานส่วนตัว</noscript>
    </section>

    <footer>
      <p data-t="disclaimer">คำอ่านสร้างด้วย AI เพื่อความบันเทิงและสำรวจตัวเอง</p>
    </footer>
  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
