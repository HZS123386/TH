<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FATE · Western astrology and personal reports">
  <meta name="theme-color" content="#130c24">
  <style>
    html, body { margin: 0; background: #130c24; color-scheme: dark; }
  </style>
  <link rel="preload" href="assets/assets/fonts/NotoSansThai.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NotoSansSC-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/images/astrologer.webp" as="fetch" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FATE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FATE</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Opt-in local diagnostics measure the actual first Flutter frame.
    if (new URLSearchParams(location.search).get('startup') === '1') {
      window.addEventListener('flutter-first-frame', () => {
        console.debug('[FATE startup] ' + JSON.stringify({
          firstFrameMs: Math.round(performance.now()),
          resources: performance.getEntriesByType('resource')
            .filter(entry => /main\.dart|canvaskit|fonts\/|astrologer/.test(entry.name))
            .map(entry => ({
              name: new URL(entry.name).pathname,
              startMs: Math.round(entry.startTime),
              endMs: Math.round(entry.responseEnd),
              bytes: entry.transferSize,
            })),
        }));
      }, { once: true });
    }
  </script>
</head>
<body>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
