limitsText:['日出容差预先设为 2 分钟；实际物理日出还受海拔、地形、天气影响。时区用固定 IANA 2025b 事实对照运行环境，并由 Python 再检查。三个历法日期不能代表全部年份。当前没有独立、同流派的行星与上升人工对盘样本，因此这部分外部计算准确率尚待核验；未来事件的预测准确率也未建立。','กำหนดเกณฑ์อาทิตย์ขึ้นไว้ 2 นาที สภาพจริงขึ้นกับความสูง ภูมิประเทศ และอากาศ เทียบเขตเวลากับข้อมูล IANA 2025b และตรวจ Python เพิ่ม วันจันทรคติ 3 วันไม่แทนทุกปี ยังไม่มีตัวอย่างตรวจดาวและลัคนาจากแหล่งอิสระสายเดียวกัน จึงยังสรุปความแม่นยำภายนอกหรือการทำนายอนาคตไม่ได้','Ngưỡng bình minh đặt trước là 2 phút; thực tế còn phụ thuộc địa hình, độ cao và thời tiết. Đối chiếu múi giờ với IANA 2025b và kiểm lại bằng Python. Ba ngày âm lịch không đại diện mọi năm. Chưa có mẫu hành tinh/cung mọc độc lập cùng trường phái; chưa xác lập độ chính xác bên ngoài hoặc khả năng dự đoán sự kiện.','Sunrise tolerance was set to 2 minutes before measurement; real sunrise also depends on elevation, terrain and weather. Runtime offsets are compared with IANA 2025b facts and separately checked in Python. Three lunar dates do not represent all years. Independent same-school planetary/ascendant reference cases are still missing; external positional accuracy and future-event predictive accuracy are not established.'],
rules:['本版本使用日出参照、固定 Anto 升起时长、whole-sign 宫制、历史曼谷 +06:42:04 行星框架；ทักษา 06:00 换日，不另换周三夜间罗睺。泰国流派并非只有一种，海外上升也需同口径核验。未知时间不推测上升、宫位与ทักษา。','รุ่นนี้ใช้อาทิตย์ขึ้น อันโตคงที่ ภพแบบราศี และกรอบกรุงเทพฯ เดิม +06:42:04 ทักษาเปลี่ยน 06:00 ไม่แยกพุธกลางคืนเป็นราหู โหราศาสตร์ไทยมีหลายสำนัก ต่างประเทศต้องตรวจด้วยหลักเดียวกัน ไม่เดาลัคนา ภพ หรือทักษาเมื่อไม่ทราบเวลาเกิด','Bản này dùng bình minh, thời lượng Anto cố định, cung nhà nguyên dấu, khung Bangkok lịch sử +06:42:04; Taksa đổi 06:00, không đổi Rahu tối thứ Tư. Có nhiều trường phái Thái; địa điểm nước ngoài cần kiểm cùng quy tắc. Không đoán cung mọc, cung nhà hay Taksa khi thiếu giờ.','This version uses sunrise, fixed Anto rising durations, whole-sign houses and the historical Bangkok +06:42:04 planetary frame. Taksa changes at 06:00 without a Wednesday-night Rahu switch. Thai schools vary; overseas use needs matching-convention checks. Unknown times do not produce inferred ascendants, houses or Taksa.'],
next:['后续如何验证解读','ตรวจคำอ่านต่ออย่างไร','Cách kiểm tra luận giải tiếp theo','How to validate readings next'],
nextText:['建立获得同意的测试集：先用同流派泰国老师和历书核对日期、坐标、时间口径与星位，逐项保存参考结果与容差。再由泰语母语评审检查术语、引用工具事实比例、虚构率和建议是否贴合问题。若要评价事件预测，必须预先定义可观察结果、时间窗口、基准组，做前瞻性留出验证并报告置信区间；满意度不能代替预测准确率。','สร้างชุดทดสอบที่ได้รับความยินยอม เทียบครูไทยและปฏิทินสายเดียวกันโดยกำหนดวัน พิกัด เวลา และเกณฑ์ก่อน ให้ผู้ประเมินเจ้าของภาษาเช็กศัพท์ ข้อเท็จจริงที่อ้างอิง การแต่งข้อมูล และความเกี่ยวข้อง หากจะวัดคำทำนายเหตุการณ์ ต้องกำหนดผลลัพธ์ ช่วงเวลา กลุ่มฐาน และชุดทดสอบล่วงหน้า พร้อมช่วงความเชื่อมั่น ความพึงพอใจไม่ใช่ความแม่นยำในการทำนาย','Tạo bộ mẫu có sự đồng ý; đối chiếu chuyên gia Thái và lịch cùng trường phái với quy tắc và sai số định trước. Người bản ngữ chấm thuật ngữ, mức bám dữ liệu, bịa đặt và độ liên quan. Đo dự đoán sự kiện cần định nghĩa kết quả, thời hạn, nhóm nền và tập kiểm tra trước, báo khoảng tin cậy. Hài lòng không thay thế độ chính xác dự đoán.','Build a consented reference set with Thai practitioners and calendars from the same school, fixing inputs, conventions and tolerances first. Have native Thai reviewers score terminology, grounded facts, hallucination and relevance. Event prediction requires predefined observable outcomes, time windows, baselines and prospective held-out evaluation with confidence intervals. Satisfaction is not predictive accuracy.'],
